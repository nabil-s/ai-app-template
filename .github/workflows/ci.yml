name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # manual trigger also runs the paid live evals

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Tests
        run: uv run pytest -q
      - name: Evals (replay - free, deterministic)
        run: uv run python evals/run_evals.py --mode replay

  live-evals:
    # Paid: runs only when triggered by hand. Skips cleanly if no key is configured.
    if: github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: anthropic
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --extra anthropic
      - name: Evals (live)
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "No ANTHROPIC_API_KEY secret; skipping."; exit 0; fi
          uv run python evals/run_evals.py --mode live
          uv run python -m ai_app.telemetry
